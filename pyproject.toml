[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "effero"
version = "0.1.4"
description = "One runtime for perceiving, reasoning, and acting across computers, robots, and connected devices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Effero Contributors" }]
keywords = ["agentic-ai", "robotics", "iot", "mcp", "llm", "voice", "vision", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "aiofiles>=24.1",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "pillow>=10",
]

[project.optional-dependencies]
# Speech pipelines (ASR/TTS). Kept optional so `pip install effero` stays light.
voice = ["faster-whisper", "piper-tts"]
# Vision pipelines (detection/grounding).
vision = ["ultralytics"]
# Robotics middleware bridge.
ros2 = ["rclpy"]
# IoT protocol bridge.
iot = ["aiomqtt>=2", "paho-mqtt>=2"]
serial = ["pyserial-asyncio>=0.6"]
cloud = ["httpx>=0.27"]
llm = ["openai>=1.40", "anthropic>=0.34", "google-genai>=1.0"]
all = ["effero[voice,vision,iot,serial,cloud,llm]"]
# Everything needed to develop Effero itself.
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "playwright>=1.40",
  "numpy>=1.26",
  "psutil>=6.0",
  "onnx>=1.16",
  "onnxruntime>=1.19",
]

[project.scripts]
effero = "effero.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/thrive-spectrexq/effero"
Documentation = "https://github.com/thrive-spectrexq/effero#readme"
Changelog = "https://github.com/thrive-spectrexq/effero/blob/main/CHANGELOG.md"
Issues = "https://github.com/thrive-spectrexq/effero/issues"
Source = "https://github.com/thrive-spectrexq/effero"

[tool.hatch.build.targets.wheel]
packages = ["src/effero"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Markdown files contain illustrative code fences (README, examples) that
# aren't meant to be linted/formatted as standalone source files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B904", "E501"]

[tool.ruff.lint.per-file-ignores]
# Backend adapter modules check optional package availability at runtime via import
"src/effero/core/router/openai_backend.py" = ["F401"]
"src/effero/core/router/anthropic_backend.py" = ["F401"]
"src/effero/core/router/google_backend.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
