[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "effero"
version = "0.1.0a1"
description = "One runtime for perceiving, reasoning, and acting across computers, robots, and connected devices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Effero Contributors" }]
keywords = ["agentic-ai", "robotics", "iot", "mcp", "llm", "voice", "vision", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Speech pipelines (ASR/TTS). Kept optional so `pip install effero` stays light.
voice = ["faster-whisper", "piper-tts"]
# Vision pipelines (detection/grounding).
vision = ["ultralytics"]
# Robotics middleware bridge.
ros2 = ["rclpy"]
# IoT protocol bridge.
iot = ["paho-mqtt"]
# Everything needed to develop Effero itself.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
effero = "effero.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/thrive-spectrexq/effero"
Issues = "https://github.com/thrive-spectrexq/effero/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/effero"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown files contain illustrative code fences (README, examples) that
# aren't meant to be linted/formatted as standalone source files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
