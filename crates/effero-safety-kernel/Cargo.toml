[package]
name = "effero-safety-kernel"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
globset = "=0.4.14"
indexmap = "=2.2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal"] }
