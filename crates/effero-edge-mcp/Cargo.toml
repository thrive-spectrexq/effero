[package]
name = "effero-edge-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
