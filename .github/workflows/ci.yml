name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/effero
        continue-on-error: true # tighten once core modules have real implementations

      - name: Run tests
        run: pytest --cov=effero --cov-report=term-missing

  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [effero-safety-kernel, effero-edge-mcp]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build
        run: cargo build -p ${{ matrix.crate }}

      - name: Test
        run: cargo test -p ${{ matrix.crate }}

      - name: Clippy
        run: cargo clippy -p ${{ matrix.crate }} -- -D warnings
        continue-on-error: true # tighten once effero-edge-mcp has a confirmed-working build
