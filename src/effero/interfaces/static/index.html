<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effero Agent Console</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #2ea043;
      --red: #da3633;
      --amber: #d29922;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      background: rgba(46, 160, 67, 0.15);
      color: var(--green);
      border: 1px solid rgba(46, 160, 67, 0.4);
    }
    .status-badge.disconnected {
      background: rgba(218, 54, 51, 0.15);
      color: var(--red);
      border-color: rgba(218, 54, 51, 0.4);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 480px;
    }
    .chat-messages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      max-width: 80%;
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .message.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
    }
    .message.agent {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .chat-input-bar {
      display: flex;
      border-top: 1px solid var(--border);
      padding: 0.75rem;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #2ea043; }
    .events-feed {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.75rem;
      overflow-y: auto;
      height: 480px;
      background: #090d13;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.4rem;
    }
    .event-line {
      border-bottom: 1px solid #161b22;
      padding-bottom: 0.3rem;
      word-break: break-all;
    }
    .event-topic { color: var(--accent); }
    .approvals-panel {
      grid-column: 1 / -1;
    }
    .approval-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .approval-btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .btn-approve { background: var(--green); }
    .btn-deny { background: var(--red); }
  </style>
</head>
<body>
  <header>
    <div class="logo">⚡ Effero Agent Runtime</div>
    <div id="connectionStatus" class="status-badge">● Connected</div>
  </header>

  <main>
    <div class="card chat-container">
      <div class="card-header">Interactive Agent Console</div>
      <div id="chatMessages" class="chat-messages">
        <div class="message agent">Welcome to Effero. Enter an instruction or command to begin.</div>
      </div>
      <form id="chatForm" class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Type instruction (e.g. 'move arm to 0.2, 0.1, 0.2' or 'check system health')..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>

    <div class="card">
      <div class="card-header">Live Event Bus Stream</div>
      <div id="eventsFeed" class="events-feed"></div>
    </div>

    <div class="card approvals-panel" id="approvalsCard" style="display: none;">
      <div class="card-header" style="color: var(--amber);">🚨 Pending Safety Approvals</div>
      <div id="approvalsList"></div>
    </div>
  </main>

  <script>
    const statusBadge = document.getElementById("connectionStatus");
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const eventsFeed = document.getElementById("eventsFeed");
    const approvalsCard = document.getElementById("approvalsCard");
    const approvalsList = document.getElementById("approvalsList");

    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${proto}//${location.host}/ws/events`;
    let ws;

    function connectWS() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        statusBadge.className = "status-badge";
        statusBadge.innerText = "● Connected";
      };
      ws.onclose = () => {
        statusBadge.className = "status-badge disconnected";
        statusBadge.innerText = "○ Disconnected (Reconnecting...)";
        setTimeout(connectWS, 3000);
      };
      ws.onmessage = (msg) => {
        try {
          const data = JSON.parse(msg.data);
          handleMessage(data);
        } catch (e) {
          console.error("Invalid JSON:", e);
        }
      };
    }

    function handleMessage(data) {
      if (data.type === "event") {
        const div = document.createElement("div");
        div.className = "event-line";
        div.innerHTML = `<span class="event-topic">[${data.topic}]</span> ${JSON.stringify(data.data)}`;
        eventsFeed.prepend(div);
      } else if (data.type === "approval_required") {
        renderApproval(data);
      }
    }

    function renderApproval(req) {
      approvalsCard.style.display = "block";
      const item = document.createElement("div");
      item.id = `req-${req.request_id}`;
      item.className = "approval-item";
      item.innerHTML = `
        <div>
          <strong>${req.skill_name}</strong> &mdash; <em>${req.reason}</em>
          <div style="font-family: var(--font-mono); font-size: 0.8rem; margin-top: 0.25rem;">
            Args: ${JSON.stringify(req.arguments)}
          </div>
        </div>
        <div class="approval-btn-group">
          <button class="btn-approve" onclick="resolveApproval('${req.request_id}', true)">Authorize</button>
          <button class="btn-deny" onclick="resolveApproval('${req.request_id}', false)">Deny</button>
        </div>
      `;
      approvalsList.appendChild(item);
    }

    async function resolveApproval(requestId, approved) {
      await fetch(`/v1/approvals/${requestId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved })
      });
      const el = document.getElementById(`req-${requestId}`);
      if (el) el.remove();
      if (approvalsList.children.length === 0) {
        approvalsCard.style.display = "none";
      }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.innerText = text;
      chatMessages.appendChild(userMsg);
      chatInput.value = "";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const resp = await fetch("/v1/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const json = await resp.json();
        const agentMsg = document.createElement("div");
        agentMsg.className = "message agent";
        agentMsg.innerText = json.response || "(empty response)";
        chatMessages.appendChild(agentMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (err) {
        const errDiv = document.createElement("div");
        errDiv.className = "message agent";
        errDiv.innerText = `Error communicating with agent: ${err}`;
        chatMessages.appendChild(errDiv);
      }
    });

    connectWS();
  </script>
</body>
</html>
